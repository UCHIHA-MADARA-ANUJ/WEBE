<svg xmlns="http://www.w3.org/2000/svg" width="420" height="420" viewBox="0 0 420 420" fill="none" role="img" aria-label="Sharingan">

  <defs>
    <radialGradient id="irisGrad" cx="0.42" cy="0.36" r="0.72">
      <stop offset="0" stop-color="#E8453F"/>
      <stop offset="0.38" stop-color="#C1121F"/>
      <stop offset="0.74" stop-color="#5C060C"/>
      <stop offset="1" stop-color="#2A0206"/>
    </radialGradient>

    <radialGradient id="eyeGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#E01E2B" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#8B0A14" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#8B0A14" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="voidGlow" cx="0.74" cy="0.44" r="0.62">
      <stop offset="0" stop-color="#C1121F" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#8B0A14" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#06050A" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="emberWash" cx="0.10" cy="0.95" r="0.55">
      <stop offset="0" stop-color="#FF7A18" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#FF7A18" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="ruleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C1121F" stop-opacity="0.85"/>
      <stop offset="0.45" stop-color="#FF7A18" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#C1121F" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="nameGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF3EA"/>
      <stop offset="0.55" stop-color="#F5EFE6"/>
      <stop offset="1" stop-color="#C9A9A0"/>
    </linearGradient>

    <pattern id="gridFine" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" stroke="#FFFFFF" stroke-opacity="0.022" stroke-width="1"/>
    </pattern>

    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="420" height="420" fill="none"/>
  
  <g>
    <circle cx="210.0" cy="210.0" r="180.0" fill="none" stroke="#C1121F" stroke-opacity="0.20" stroke-width="1">
      <animate attributeName="r" values="171.0;195.0;171.0" dur="4.5s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.24;0.03;0.24" dur="4.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="210.0" cy="210.0" r="174.0" fill="url(#eyeGlow)"/>

    <circle cx="210.0" cy="210.0" r="150.0" fill="url(#irisGrad)"/>
    <circle cx="210.0" cy="210.0" r="132.0" fill="none" stroke="#FF3B3B" stroke-opacity="0.10" stroke-width="1"/>
    <circle cx="210.0" cy="210.0" r="150.0" fill="none" stroke="#E01E2B" stroke-opacity="0.50" stroke-width="1.8"/>
    <circle cx="210.0" cy="210.0" r="143.2" fill="none" stroke="#06050A" stroke-opacity="0.60" stroke-width="2.4"/>

    <g transform="translate(210.0,210.0)" opacity="0.97"><animateTransform attributeName="transform" type="rotate" from="0 210.0 210.0" to="360 210.0 210.0" dur="10s" repeatCount="indefinite" additive="replace"/><g transform="rotate(0.0) translate(0,-87.75)"><g transform="scale(1.8611111111111112)"><path d="M 0,-14 A 14,14 0 1 1 -12.1,7 C -8,12 -3,16 2,23 C 4,26.5 1.5,29.5 -1.8,28 C -9,24.5 -14,17 -14,7 A 14,14 0 0 1 0,-14 Z" fill="#050308"/></g></g><g transform="rotate(120.0) translate(0,-87.75)"><g transform="scale(1.8611111111111112)"><path d="M 0,-14 A 14,14 0 1 1 -12.1,7 C -8,12 -3,16 2,23 C 4,26.5 1.5,29.5 -1.8,28 C -9,24.5 -14,17 -14,7 A 14,14 0 0 1 0,-14 Z" fill="#050308"/></g></g><g transform="rotate(240.0) translate(0,-87.75)"><g transform="scale(1.8611111111111112)"><path d="M 0,-14 A 14,14 0 1 1 -12.1,7 C -8,12 -3,16 2,23 C 4,26.5 1.5,29.5 -1.8,28 C -9,24.5 -14,17 -14,7 A 14,14 0 0 1 0,-14 Z" fill="#050308"/></g></g></g>

    <circle cx="210.0" cy="210.0" r="30.7" fill="#040206"/>
    <circle cx="210.0" cy="210.0" r="30.7" fill="none" stroke="#C1121F" stroke-opacity="0.40" stroke-width="1.3">
      <animate attributeName="stroke-opacity" values="0.15;0.65;0.15" dur="3.2s" repeatCount="indefinite"/>

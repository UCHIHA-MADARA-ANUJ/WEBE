<svg xmlns="http://www.w3.org/2000/svg" width="640" height="52" viewBox="0 0 640 52" fill="none" role="img" aria-label="Wake up to reality.">
  <defs>
    <clipPath id="reveal">
      <rect x="0" y="0" width="0" height="52">
        <animate attributeName="width" from="0" to="161" dur="2.2s" begin="0.4s" fill="freeze"/>
      </rect>
    </clipPath>
  </defs>

  <text x="242" y="34" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" letter-spacing="1.6"
        fill="#FF3B3B" clip-path="url(#reveal)">Wake up to reality.</text>

  <rect x="242" y="16" width="9" height="22" fill="#FF3B3B" opacity="0">
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.05;0.95;1;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="360" height="360" viewBox="0 0 360 360" fill="none" role="img" aria-label="The eclipse">
  <defs>
    <radialGradient id="mHalo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#D01731" stop-opacity="0.26"/>
      <stop offset="0.55" stop-color="#D01731" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#D01731" stop-opacity="0"/>
